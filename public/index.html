        name: editing ? editing.name : document.getElementById("itName").value.trim(),
        unit: document.getElementById("itUnit").value.trim(),
        minStock: parseFloat(document.getElementById("itMin").value) || 0,
        maxStock: parseFloat(document.getElementById("itMax").value) || null,
        piecesPerPack: parseFloat(document.getElementById("itPiecesPerPack").value) || null
      }, modal.editId);
    });
    var modalCancel = document.getElementById("modalCancel");
    if (modalCancel) modalCancel.addEventListener("click", function(){ modal=null; render(); });
    var confirmYesBtn = document.getElementById("confirmYesBtn");
    if (confirmYesBtn) confirmYesBtn.addEventListener("click", function(){
      var cb = modal.onConfirm;
      modal = null;
      render();
      if (cb) cb();
    });
    var numPromptForm = document.getElementById("numPromptForm");
    if (numPromptForm) numPromptForm.addEventListener("submit", function(e){
      e.preventDefault();
      var vals = modal.fields.map(function(f, i){ return parseFloat(document.getElementById("npField"+i).value); });
      var cb = modal.onSubmit;
      modal = null;
      render();
      if (cb) cb(vals);
    });

    // transfers
    var srcSel = document.getElementById("tfSrc");
    if (srcSel){ syncTfDst(); srcSel.addEventListener("change", syncTfDst); }
    var tfForm = document.getElementById("transferForm");
    if (tfForm) tfForm.addEventListener("submit", function(e){
      e.preventDefault();
      var qty = parseFloat(document.getElementById("tfQty").value);
      if (!qty || qty <= 0){ setBanner("bad","Enter a quantity greater than zero."); return; }
      submitTransfer(document.getElementById("tfSrc").value, document.getElementById("tfDst").value, document.getElementById("tfItem").value, qty);
    });
    document.querySelectorAll("[data-approve]").forEach(function(el){ el.addEventListener("click", function(){ decideTransfer(el.getAttribute("data-approve"), true); }); });
    document.querySelectorAll("[data-reject]").forEach(function(el){ el.addEventListener("click", function(){ decideTransfer(el.getAttribute("data-reject"), false); }); });

    // menu
    var addMenuBtn = document.getElementById("addMenuBtn");
    if (addMenuBtn) addMenuBtn.addEventListener("click", function(){
      menuFormRecipe = [];
      modal = {type:"menu", draftName:"", draftPrice:""};
      render();
    });
    document.querySelectorAll("[data-edit-menu]").forEach(function(el){
      el.addEventListener("click", function(){
        var mi = menuItemById(el.getAttribute("data-edit-menu"));
        menuFormRecipe = mi && mi.recipe ? mi.recipe.slice() : [];
        modal = {type:"menu", editId: el.getAttribute("data-edit-menu"), draftName: mi?mi.name:"", draftPrice: mi?mi.price:""};
        render();
      });
    });
    document.querySelectorAll("[data-delete-menu]").forEach(function(el){
      el.addEventListener("click", function(){ deleteMenuItem(el.getAttribute("data-delete-menu")); });
    });
    var miAddIngBtn = document.getElementById("miAddIngBtn");
    if (miAddIngBtn) miAddIngBtn.addEventListener("click", function(){
      var itemId = document.getElementById("miIngredient").value;
      var qty = parseFloat(document.getElementById("miIngQty").value);
      modal.draftName = document.getElementById("miName").value;
      modal.draftPrice = document.getElementById("miPrice").value;
      if (!qty || qty<=0){ setBanner("bad","Enter a quantity greater than zero."); return; }
      var existing = menuFormRecipe.filter(function(r){ return r.itemId===itemId; })[0];
      if (existing) existing.qty = qty; else menuFormRecipe.push({itemId:itemId, qty:qty});
      render();
    });
    document.querySelectorAll("[data-recipe-remove]").forEach(function(el){
      el.addEventListener("click", function(){
        modal.draftName = document.getElementById("miName").value;
        modal.draftPrice = document.getElementById("miPrice").value;
        menuFormRecipe = menuFormRecipe.filter(function(r){ return r.itemId !== el.getAttribute("data-recipe-remove"); });
        render();
      });
    });
    var menuForm = document.getElementById("menuForm");
    if (menuForm) menuForm.addEventListener("submit", function(e){
      e.preventDefault();
      var name = document.getElementById("miName").value.trim();
      var price = parseFloat(document.getElementById("miPrice").value) || 0;
      saveMenuItem(name, price, modal.editId);
    });

    // purchases
    var poBranchSel = document.getElementById("poBranch");
    if (poBranchSel) poBranchSel.addEventListener("change", function(){ purchaseBranch = poBranchSel.value; render(); });
    var poAddLineBtn = document.getElementById("poAddLineBtn");
    if (poAddLineBtn) poAddLineBtn.addEventListener("click", function(){
      var itemId = document.getElementById("poItem").value;
      var qty = parseFloat(document.getElementById("poQty").value);
      var cost = parseFloat(document.getElementById("poCost").value);
      purchaseSupplierDraft = document.getElementById("poSupplier").value;
      if (!qty || qty<=0){ setBanner("bad","Enter a quantity greater than zero."); return; }
      if (isNaN(cost) || cost<0){ setBanner("bad","Enter a valid cost."); return; }
      addPurchaseLine(itemId, qty, cost);
    });
    document.querySelectorAll("[data-po-remove]").forEach(function(el){
      el.addEventListener("click", function(){ removePurchaseLine(el.getAttribute("data-po-remove")); });
    });
    var poSubmitBtn = document.getElementById("poSubmitBtn");
    if (poSubmitBtn) poSubmitBtn.addEventListener("click", function(){
      submitPurchase(document.getElementById("poSupplier").value.trim());
    });

    // settings
    var addBranchBtn = document.getElementById("addBranchBtn");
    if (addBranchBtn) addBranchBtn.addEventListener("click", function(){
      addBranch(document.getElementById("newBranchName").value.trim());
    });
    document.querySelectorAll("[data-delete-branch]").forEach(function(el){
      el.addEventListener("click", function(){ deleteBranch(el.getAttribute("data-delete-branch")); });
    });
    var addPayMethodBtn = document.getElementById("addPayMethodBtn");
    if (addPayMethodBtn) addPayMethodBtn.addEventListener("click", function(){
      addPaymentMethod(document.getElementById("newPayMethodName").value.trim());
    });
    document.querySelectorAll("[data-delete-paymethod]").forEach(function(el){
      el.addEventListener("click", function(){ deletePaymentMethod(el.getAttribute("data-delete-paymethod")); });
    });
    var addUserBtn = document.getElementById("addUserBtn");
    if (addUserBtn) addUserBtn.addEventListener("click", function(){ modal={type:"user"}; render(); });
    document.querySelectorAll("[data-edit-user]").forEach(function(el){
      el.addEventListener("click", function(){ modal={type:"user", editId: el.getAttribute("data-edit-user")}; render(); });
    });
    document.querySelectorAll("[data-delete-user]").forEach(function(el){
      el.addEventListener("click", function(){ deleteUser(el.getAttribute("data-delete-user")); });
    });
    var userForm = document.getElementById("userForm");
    if (userForm) userForm.addEventListener("submit", function(e){
      e.preventDefault();
      var editingU = modal.editId ? usersCache.filter(function(u){ return u.id===modal.editId; })[0] : null;
      saveUser({
        username: editingU ? editingU.username : document.getElementById("usrName").value.trim(),
        password: document.getElementById("usrPass").value,
        role: document.getElementById("usrRole").value,
        branch: document.getElementById("usrBranch").value

    });

    // analytics
    var anBranch = document.getElementById("anBranch");
    if (anBranch) anBranch.addEventListener("change", function(){ analyticsBranch = anBranch.value; render(); });
    var anWindow = document.getElementById("anWindow");
    if (anWindow) anWindow.addEventListener("change", function(){ analyticsWindow = anWindow.value; render(); });
    var anIngredient = document.getElementById("anIngredient");
    if (anIngredient) anIngredient.addEventListener("change", function(){ analyticsIngredientId = anIngredient.value; render(); });
    var anBucket = document.getElementById("anBucket");
    if (anBucket) anBucket.addEventListener("change", function(){ analyticsBucket = anBucket.value; render(); });

    // reports
    var repBranch = document.getElementById("repBranch");
    if (repBranch) repBranch.addEventListener("change", function(){ reportState.branch = repBranch.value; render(); });
    var repGroup = document.getElementById("repGroup");
    if (repGroup) repGroup.addEventListener("change", function(){ reportState.groupBy = repGroup.value; render(); });
    var repFrom = document.getElementById("repFrom");
    if (repFrom) repFrom.addEventListener("change", function(){ reportState.from = repFrom.value; render(); });
    var repTo = document.getElementById("repTo");
    if (repTo) repTo.addEventListener("change", function(){ reportState.to = repTo.value; render(); });
    var exportBtn = document.getElementById("exportCsvBtn");
    if (exportBtn) exportBtn.addEventListener("click", exportCsv);
  }
})();
